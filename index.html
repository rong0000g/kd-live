<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>答辩同声助手</title>
<style>
/* One column for an iPhone lying on the desk: status + caption on top, the answer card fills the screen. */
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --ink:#15202A; --muted:#5A6772; --line:#D6DEDC;
  --accent:#2C4784; --on-accent:#FFFFFF; --celadon:#3F8676; --celadon-soft:#E1EEEA; --warn:#A3462C; --warn-soft:#F7E6E0;
  --f-ko:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --f-body:-apple-system,system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0E1418; --surface:#162027; --ink:#E6ECEA; --muted:#93A1A9; --line:#26333B;
  --accent:#93ACEB; --on-accent:#0E1418; --celadon:#7CC4B1; --celadon-soft:#183029; --warn:#E89478; --warn-soft:#33201A; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;padding-inline:max(14px,env(safe-area-inset-left));padding-block:env(safe-area-inset-top) calc(30px + env(safe-area-inset-bottom))}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:10px}
h1{font-size:1.1rem;margin:0}
.pill{font-size:.8rem;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.pill.on{color:var(--celadon);border-color:var(--celadon)} .pill.on i{background:var(--celadon);animation:pulse 1.4s infinite}
.pill.busy{color:var(--accent);border-color:var(--accent)} .pill.busy i{background:var(--accent)}
.pill.bad{color:var(--warn);border-color:var(--warn)} .pill.bad i{background:var(--warn)}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.pill.on i{animation:none}}
#toggle{font:inherit;font-size:1.1rem;font-weight:700;padding:16px;border-radius:12px;border:0;background:var(--accent);color:var(--on-accent);cursor:pointer}
#toggle.stop{background:var(--surface);color:var(--warn);border:1px solid var(--warn)}
#caption{font-family:var(--f-ko);font-size:.95rem;color:var(--muted);min-height:1.5em;padding:8px 12px;border-radius:10px;background:var(--surface);border:1px dashed var(--line);overflow-wrap:anywhere}
#meter{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
#meter b{display:block;height:100%;width:0;background:var(--celadon);transition:width .08s linear}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.qmean{font-size:.92rem;color:var(--celadon);background:var(--celadon-soft);border-radius:8px;padding:7px 10px}
.heard{font-family:var(--f-ko);font-size:.85rem;color:var(--muted)}
.pair{display:flex;flex-direction:column;gap:2px}
.ko{font-family:var(--f-ko);font-size:1.42rem;line-height:1.55;font-weight:700;word-break:keep-all;overflow-wrap:anywhere}
.pr{font-size:.85rem;color:var(--accent)}
.zh{font-size:.92rem;color:var(--muted)}
.ph{color:var(--muted);font-size:.92rem}
.note{font-size:.85rem;padding:8px 12px;border-radius:8px;background:var(--warn-soft);color:var(--warn);margin:0}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
summary{cursor:pointer;font-weight:600;padding:2px 0}
details[open] summary{margin-bottom:10px}
.form{display:flex;flex-direction:column;gap:10px}
.form label{font-size:.8rem;color:var(--muted)}
input[type=text],input[type=password],input[type=search],select{width:100%;font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-size:.92rem;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.opt{display:inline-flex;gap:6px;align-items:center;font-size:.88rem}
.hint{font-size:.8rem;color:var(--muted);margin:0}
.ok{color:var(--celadon)} .err{color:var(--warn)}
#hist .card{opacity:.85}
#hist .ko{font-size:1.05rem;font-weight:600}
.qa{padding:10px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.qa:last-child{border-bottom:0}
.qa .t{font-weight:700}
.qa .ko{font-size:1.02rem;font-weight:500}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>答辩同声助手</h1>
    <span class="pill" id="state"><i></i><span>未开始</span></span>
  </header>

  <details id="setup">
    <summary>设置（第一次用先填这里）</summary>
    <div class="form">
      <label for="pw">资料密码（解锁论文速查卡）</label>
      <div class="row"><input type="password" id="pw" autocomplete="off" style="flex:1"><button class="btn pri" id="unlockBtn">解锁</button></div>
      <p class="hint" id="pwMsg"></p>

      <label for="key">Gemini API Key（只保存在这台手机里）</label>
      <div class="row"><input type="password" id="key" autocomplete="off" style="flex:1"><button class="btn pri" id="keyBtn">保存</button></div>
      <p class="hint">在 aistudio.google.com/apikey 用谷歌账号免费创建，复制过来粘贴。</p>

      <label for="model">模型</label>
      <select id="model"><option value="">先保存 Key，会自动列出可用模型</option></select>
      <p class="hint" id="modelMsg"></p>

      <label>识别方式</label>
      <div class="row">
        <label class="opt"><input type="radio" name="mode" value="speech" checked> 手机听写（快，推荐）</label>
        <label class="opt"><input type="radio" name="mode" value="audio"> 录音交给 Gemini 听（术语更准，稍慢）</label>
      </div>
      <label>回答</label>
      <div class="row">
        <label class="opt"><input type="radio" name="len" value="3" checked> 3 句</label>
        <label class="opt"><input type="radio" name="len" value="5"> 5 句</label>
        <label class="opt"><input type="checkbox" id="pr"> 附罗马字发音</label>
      </div>
      <div class="row"><button class="btn" id="testBtn">用一个问题测试</button><span class="hint" id="testMsg"></span></div>
    </div>
  </details>

  <button id="toggle">开始听</button>
  <div id="meter" hidden><b></b></div>
  <div id="caption" lang="ko">按「开始听」后，教授说的话会实时显示在这里。</div>

  <div class="card" id="answer" aria-live="polite">
    <div class="ph">识别到教授的问题后，韩语回答会自动出现在这里，每句下面有中文意思。你念回答时它会自动忽略你自己的声音。</div>
  </div>

  <div id="hist"></div>

  <details>
    <summary>问答稿 31 题（可搜索）</summary>
    <input type="search" id="qf" placeholder="输入中文或韩文关键词">
    <div id="qaList"></div>
  </details>

  <details>
    <summary>救场句</summary>
    <div id="phr"></div>
  </details>
</div>

/* ---------------- data unlock ---------------- */
let DATA = null;
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64d(BUNDLE.salt), iterations: BUNDLE.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64d(BUNDLE.iv) }, key, b64d(BUNDLE.ct));
  DATA = JSON.parse(new TextDecoder().decode(pt));
  renderQA();
}
async function tryUnlock(pw, silent){
  try { await unlock(pw); S.set("da_pw", pw); $("#pwMsg").textContent = "已解锁论文速查卡。"; $("#pwMsg").className = "hint ok"; return true; }
  catch { if (!silent) { $("#pwMsg").textContent = "密码不对，再输一次。"; $("#pwMsg").className = "hint err"; } return false; }
}
$("#unlockBtn").onclick = () => tryUnlock($("#pw").value.trim());

/* ---------------- Gemini ---------------- */
const API = "https://generativelanguage.googleapis.com/v1beta/";
let thinkingOff = S.get("da_nothink", "") === "1";
$("#key").value = S.get("da_key", "");
function modelScore(name){
  const v = parseFloat((name.match(/gemini-(\d+(?:\.\d+)?)/) || [0, 0])[1]) || 0;
  return v * 10 - (/lite/.test(name) ? 3 : 0) - (/preview|exp/.test(name) ? 1 : 0);
}
async function loadModels(){
  const key = S.get("da_key", ""); if (!key) return;
  const msg = $("#modelMsg"); msg.textContent = "正在读取可用模型…"; msg.className = "hint";
  try {
    const r = await fetch(API + "models?pageSize=200&key=" + encodeURIComponent(key));
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    const names = (j.models || [])
      .filter(m => (m.supportedGenerationMethods || []).includes("generateContent"))
      .map(m => m.name.replace(/^models\//, ""))
      .filter(n => /^gemini-.*flash/.test(n) && !/(image|tts|live|audio|embed|thinking|computer|robotics|native)/.test(n))
      .sort((a, b) => modelScore(b) - modelScore(a));
    if (!names.length) throw new Error("none");
    const sel = $("#model"); sel.replaceChildren(...names.map(n => { const o = el("option", null, n); o.value = n; return o; }));
    const saved = S.get("da_model", ""); sel.value = names.includes(saved) ? saved : names[0];
    S.set("da_model", sel.value);
    msg.textContent = "Key 可用。默认选了最新的 Flash 模型，速度不满意可以换带 lite 的。"; msg.className = "hint ok";
  } catch (e) {
    msg.textContent = "Key 不可用或网络不通。检查 Key 是否复制完整。"; msg.className = "hint err";
  }
}
$("#keyBtn").onclick = () => { S.set("da_key", $("#key").value.trim()); loadModels(); };
$("#model").onchange = () => S.set("da_model", $("#model").value);

function thinkingConfig(model){
  if (thinkingOff) return null;
  if (/gemini-2\.5/.test(model)) return { thinkingBudget: 0 };
  if (/gemini-[3-9]/.test(model)) return { thinkingLevel: "minimal" };
  return null;
}
async function gemini(system, parts, signal, onText){
  const key = S.get("da_key", ""), model = $("#model").value || S.get("da_model", "");
  if (!key || !model) throw { user: "先在「设置」里保存 Gemini Key。" };
  const body = { systemInstruction: { parts: [{ text: system }] }, contents: [{ role: "user", parts }], generationConfig: { temperature: 0.3, maxOutputTokens: 900 } };
  const tc = thinkingConfig(model); if (tc) body.generationConfig.thinkingConfig = tc;
  let r = await fetch(`${API}models/${model}:streamGenerateContent?alt=sse&key=${encodeURIComponent(key)}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body), signal });
  if (r.status === 400 && tc) {
    // this model does not take the thinking setting; drop it once and remember
    thinkingOff = true; S.set("da_nothink", "1"); delete body.generationConfig.thinkingConfig;
    r = await fetch(`${API}models/${model}:streamGenerateContent?alt=sse&key=${encodeURIComponent(key)}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body), signal });
  }
  if (!r.ok) {
    if (r.status === 429) throw { user: "Gemini 免费额度每分钟有次数限制，刚才请求太密了。几秒后会恢复。" };
    if (r.status === 400 || r.status === 403) throw { user: "Gemini 拒绝了请求（" + r.status + "）。检查 Key，或在设置里换一个模型。" };
    throw { user: "Gemini 暂时出错（" + r.status + "），下一句会自动再试。" };
  }
  const reader = r.body.getReader(), dec = new TextDecoder(); let buf = "", text = "";
  for (;;) {
    const { value, done } = await reader.read(); if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf("\n")) >= 0) {
      const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
      if (!line.startsWith("data:")) continue;
      try {
        const j = JSON.parse(line.slice(5));
        for (const p of (j.candidates?.[0]?.content?.parts || [])) if (p.text && !p.thought) text += p.text;
        onText(text);
      } catch {}
    }
  }
  return text;
}

/* ---------------- prompts ---------------- */
function systemText(){
  const d = DATA || { brief: "（资料未解锁）", abstract: "" };
  return `你是一名在韩国读博的中国留学生开题答辩时的实时助手。教授用韩语说话，学生必须用韩语回答，但韩语水平有限。你会收到教室里刚听到的一段话，要立刻给出学生可以照着念的韩语回答。

判断：
- 只有在明显是学生自己在念屏幕上的回答，或者只是噪音和无意义的碎片时，才只输出一行：SKIP。拿不准时一律当作教授的话来回答。
- 教授的提问、追问、质疑、评论或建议，都需要回答。教授如果只是给建议，回答就是简短致谢并说明会如何反映到研究中。
- 语音识别可能有错字、同音词错误、漏词，要结合论文资料推断教授的原意。

输出格式：每行以前缀开头，不要 markdown，不要任何其他文字。
T: 这段话的韩语原文（只有收到音频时才写这一行）
Q: 一句中文说明教授在问什么或说什么；识别有疑问时在后面加“（也可能是：…）”
KO: 韩语回答的一句
PR: 这一句的罗马字发音（只有要求时才写）
ZH: 这一句的中文意思
按 KO/PR/ZH 的顺序重复。

回答规则：
- 합니다체学术敬语。第一句可以是很短的回应，如“네, 좋은 질문 감사합니다.”，但不要每次都用同一句。
- 先给结论，再给一两个依据。每句短、常用词、好念。
- 速查卡里已有对应问答时，优先沿用其中的韩语说法和数字，并保留速查卡对证据边界的全部限定，不能把结论说得比速查卡更强。
- 只依据下面的资料。资料里没有的数字、文献、结论绝对不要编，改用“그 부분은 현재 자료로 확인한 뒤 정확히 말씀드리겠습니다.”或“앞으로 연구에서 보완하겠습니다.”这类说法。

<答辩速查卡>
${d.brief}
</答辩速查卡>

<论文摘要节选>
${d.abstract}
</论文摘要节选>`;
}
let profBuf = [];   // recent professor utterances {at, text}
let shown = null;   // answer currently on screen {q, items, heard}
function shownKO(){ return shown ? shown.items.map(i => i.ko).join(" ") : ""; }
function userText(latest, isAudio){
  const n = opt("len"), pr = $("#pr").checked;
  const recent = profBuf.filter(u => Date.now() - u.at < 60000 && u.text !== latest && !u.text.startsWith("录音 ")).slice(-3).map(u => u.text);
  let s = "";
  if (recent.length) s += "<教授前面刚说过的话>\n" + recent.join("\n") + "\n</教授前面刚说过的话>\n";
  if (shown) s += "<学生屏幕上当前的回答，学生可能正在念它>\n" + shownKO() + "\n</学生屏幕上当前的回答>\n";
  s += `本次回答 ${n} 句；${pr ? "每个 KO 行后面写 PR 行" : "不要写 PR 行"}。\n`;
  if (isAudio) s += "下面的音频是教室里刚录到的一段话。先写 T 行。";
  else s += "<刚听到的一段话（手机语音识别结果）>\n" + latest + "\n</刚听到的一段话>";
  return s;
}

/* ---------------- answer rendering ---------------- */
function parse(text){
  const a = { t: "", q: "", items: [], skip: /^\s*SKIP\b/i.test(text) };
  for (const raw of text.split("\n")) {
    const m = raw.trim().match(/^(T|Q|KO|PR|ZH)\s*[:：]\s*(.*)$/i); if (!m) continue;
    const tag = m[1].toUpperCase(), v = m[2].trim();
    if (tag === "T") a.t = v; else if (tag === "Q") a.q = v;
    else if (tag === "KO") a.items.push({ ko: v, pr: "", zh: "" });
    else { const l = a.items[a.items.length - 1]; if (l) l[tag === "PR" ? "pr" : "zh"] = v; }
  }
  return a;
}
function drawAnswer(box, a, heard){
  box.replaceChildren();
  if (a.q) box.append(el("div", "qmean", "教授在问：" + a.q));
  if (heard || a.t) box.append(el("div", "heard", "听到：" + (a.t || heard)));
  for (const it of a.items) {
    const p = el("div", "pair"); p.append(el("div", "ko", it.ko));
    if (it.pr) p.append(el("div", "pr", it.pr)); if (it.zh) p.append(el("div", "zh", it.zh));
    box.append(p);
  }
}
function pushHistory(){
  if (!shown || !shown.items.length) return;
  const c = el("div", "card"); drawAnswer(c, shown, shown.heard);
  $("#hist").prepend(c);
  while ($("#hist").children.length > 8) $("#hist").lastElementChild.remove();
}

/* ---------------- generation control ---------------- */
let gen = null;
async function respond(latest, audioB64, force){
  if (!DATA) { $("#answer").replaceChildren(el("p", "note", "资料还没解锁：在「设置」里输入资料密码。")); }
  if (gen && !gen.done) gen.ctl.abort();
  const g = gen = { ctl: new AbortController(), at: Date.now(), done: false, started: false };
  setState("生成中", "busy");
  const parts = [{ text: userText(latest, !!audioB64) + (force ? "\n学生确认这是教授的提问，必须回答，不要输出 SKIP。" : "") }];
  if (audioB64) parts.push({ inlineData: { mimeType: "audio/wav", data: audioB64 } });
  const box = $("#answer");
  try {
    const text = await gemini(systemText(), parts, g.ctl.signal, t => {
      if (gen !== g) return;
      const a = parse(t);
      if (a.skip) return;
      if (!g.started && (a.q || a.items.length)) { g.started = true; pushHistory(); }
      if (g.started) drawAnswer(box, a, latest);
    });
    g.done = true;
    if (gen !== g) return;
    const a = parse(text);
    if (a.skip || !a.items.length) {
      profBuf = profBuf.filter(u => u.text !== latest);
      const cap = $("#caption");
      cap.replaceChildren(el("span", null, "判断为不需要回答，已跳过：" + (a.t || latest) + " "));
      if (!audioB64) {
        const b = el("button", "btn", "这是问题，回答它");
        b.onclick = () => { profBuf.push({ at: Date.now(), text: latest }); respond(latest, null, true); };
        cap.append(b);
      }
    } else {
      shown = { ...a, heard: a.t || latest, at: Date.now() };
      drawAnswer(box, a, shown.heard);
      if (audioB64 && a.t) { const u = profBuf.find(u => u.text === latest); if (u) u.text = a.t; }
    }
  } catch (e) {
    g.done = true;
    if (e && e.name === "AbortError") return;
    if (gen === g) box.prepend(el("p", "note", (e && e.user) || "网络中断了，下一句会自动再试。"));
  } finally {
    if (gen === g) setState(listening ? "在听" : "未开始", listening ? "on" : "");
  }
}
function interruptIfGenerating(){
  // the professor kept talking: drop the half-done answer and wait for the full question
  if (gen && !gen.done && Date.now() - gen.at > 250) { gen.ctl.abort(); gen.done = true; setState("在听", "on"); return true; }
  return false;
}

/* student reading the answer aloud: most of what was heard appears in the answer on screen */
// sentence endings shared by any polite Korean question and answer; they say nothing about who is speaking
const COMMON = new Set(["습니","니다","니까","입니","합니","있습","했습","겠습","하겠","됩니","십니","시겠","었습","았습","이다","에서","으로","하는","것은","것이","대한","무엇","엇입"]);
function bigrams(s){
  const out = new Set();
  for (const w of (s.match(/[가-힣A-Za-z0-9]+/g) || [])) for (let i = 0; i < w.length - 1; i++) { const g = w.slice(i, i + 2); if (!COMMON.has(g)) out.add(g); }
  return out;
}
function isReadingAnswer(text){
  if (!shown || Date.now() - shown.at > 90000) return false;
  const a = bigrams(text), b = bigrams(shownKO()); if (a.size < 6) return false;
  let hit = 0; a.forEach(x => { if (b.has(x)) hit++; });
  return hit / a.size > 0.6;
}
function onUtteranceText(text){
  text = text.trim();
  if ((text.match(/[가-힣]/g) || []).length < 4) return;
  if (isReadingAnswer(text)) { $("#caption").textContent = "（你在念回答，已忽略）" + text; return; }
  profBuf.push({ at: Date.now(), text }); profBuf = profBuf.slice(-6);
  respond(text, null);
}

/* ---------------- mode 1: Safari speech recognition ---------------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
// One long continuous session started by the tap on 开始听. Questions are cut out of the running
// transcript by pauses, so the session never has to be restarted between questions (iPhone Safari
// often refuses to restart recognition without a fresh tap).
let listening = false, rec = null, recActive = false, full = "", consumedH = 0, lastRes = 0, watch = null, everHeard = false;
// Safari keeps revising text it already returned (spacing, punctuation, a word or two) a second after
// the pause. Positions are therefore counted in letters only, so a revision of the last question does
// not look like new speech and does not cancel the answer being written.
const isH = ch => /[가-힣A-Za-z0-9]/.test(ch);
function countH(s){ let n = 0; for (const ch of s) if (isH(ch)) n++; return n; }
function afterH(s, n){ let i = 0; for (const ch of s) { if (n <= 0) break; if (isH(ch)) n--; i += ch.length; } return s.slice(i); }
const pendingText = () => afterH(full, consumedH).replace(/^[^가-힣A-Za-z0-9]+/, "").trim();
function joinResults(results){
  // iPhone sometimes repeats earlier text inside later results; keep only the longest version of a run
  const parts = [];
  for (const r of Array.from(results)) {
    const t = r[0].transcript.trim(); if (!t) continue;
    const last = parts[parts.length - 1];
    if (last && t.startsWith(last)) parts[parts.length - 1] = t;
    else if (last && last.startsWith(t)) continue;
    else parts.push(t);
  }
  return parts.join(" ");
}
function flushUtterance(){
  const t = pendingText(); consumedH = countH(full);
  if (countH(t) >= 4) onUtteranceText(t);
}
function needTap(){
  // recognition stopped and Safari would not restart it on its own
  setState("点屏幕继续听", "bad");
  $("#caption").textContent = "识别暂停了：轻点屏幕任意位置继续听。";
  const resume = () => { if (listening && !recActive) startRec(); };
  document.addEventListener("click", resume, { once: true, capture: true });
}
function startRec(){
  if (!listening) return;
  try { rec && rec.abort(); } catch {}
  const r = rec = new SR(); r.lang = "ko-KR"; r.continuous = true; r.interimResults = true; r.maxAlternatives = 1;
  r.onstart = () => { if (rec !== r) return; recActive = true; full = ""; consumedH = 0; setState("在听", "on"); };
  r.onresult = e => {
    if (rec !== r) return;
    full = joinResults(e.results); lastRes = Date.now(); everHeard = true;
    const pending = pendingText();
    if (countH(pending) >= 1) $("#caption").textContent = pending;
    // only real new speech (a few letters beyond the last question) cancels the answer in progress
    if (countH(pending) >= 4) interruptIfGenerating();
  };
  r.onerror = e => {
    if (rec !== r) return;
    if ((e.error === "not-allowed" || e.error === "service-not-allowed") && !everHeard) {
      stopAll();
      $("#answer").replaceChildren(el("p", "note", "Safari 没拿到麦克风或语音识别权限。打开 设置 > 通用 > 键盘，开启「启用听写」；再在 Safari 地址栏左边「大小」菜单 > 网站设置里，把麦克风设为允许。"));
    }
  };
  r.onend = () => {
    if (rec !== r) return;
    recActive = false; flushUtterance();
    if (!listening) return;
    // try to carry on by itself; if Safari refuses, ask for one tap
    setTimeout(() => {
      if (!listening || recActive) return;
      try { startRec(); } catch {}
      setTimeout(() => { if (listening && !recActive) needTap(); }, 1500);
    }, 150);
  };
  try { r.start(); } catch { needTap(); }
}

/* ---------------- mode 2: raw audio to Gemini ---------------- */
let ac = null, stream = null, proc = null, carry = null;
function wavBase64(chunks, rate){
  let len = 0; chunks.forEach(c => len += c.length);
  const ratio = rate / 16000, n = Math.floor(len / ratio);
  const all = new Float32Array(len); let o = 0; chunks.forEach(c => { all.set(c, o); o += c.length; });
  const buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const w = (p, s) => { for (let i = 0; i < s.length; i++) v.setUint8(p + i, s.charCodeAt(i)); };
  w(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); w(8, "WAVE"); w(12, "fmt "); v.setUint32(16, 16, true);
  v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, 16000, true); v.setUint32(28, 32000, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, "data"); v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) {
    const a = Math.floor(i * ratio), b = Math.min(len, Math.floor((i + 1) * ratio)); let s = 0;
    for (let k = a; k < b; k++) s += all[k]; s = s / Math.max(1, b - a);
    s = Math.max(-1, Math.min(1, s)); v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true);
  }
  const bytes = new Uint8Array(buf); let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
async function startAudio(){
  stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  ac = new (window.AudioContext || window.webkitAudioContext)();
  await ac.resume();
  const src = ac.createMediaStreamSource(stream);
  proc = ac.createScriptProcessor(2048, 1, 1);
  src.connect(proc); proc.connect(ac.destination);
  let floor = 0.004, speaking = false, voiced = 0, quiet = 0, utt = [], pre = [];
  const bar = $("#meter b");
  proc.onaudioprocess = e => {
    const x = new Float32Array(e.inputBuffer.getChannelData(0));
    let s = 0; for (let i = 0; i < x.length; i++) s += x[i] * x[i];
    const rms = Math.sqrt(s / x.length), dt = x.length / ac.sampleRate * 1000;
    bar.style.width = Math.min(100, rms * 900) + "%";
    if (!speaking) {
      pre.push(x); if (pre.length > 10) pre.shift();
      if (rms > Math.max(floor * 3, 0.012)) {
        if (++voiced >= 2) {
          speaking = true; utt = pre.slice(); pre = []; quiet = 0;
          $("#caption").textContent = "有人在说话…";
          if (interruptIfGenerating() && gen && gen.chunks) carry = gen.chunks;
        }
      } else { voiced = 0; floor = floor * 0.97 + rms * 0.03; }
    } else {
      utt.push(x);
      quiet = rms < Math.max(floor * 2, 0.008) ? quiet + dt : 0;
      const dur = utt.length * dt;
      if (quiet >= 900 || dur > 30000) {
        speaking = false; voiced = 0;
        const chunks = carry ? carry.concat(utt) : utt; carry = null; utt = [];
        if (dur - quiet > 600) sendAudio(chunks);
      }
    }
  };
}
function sendAudio(chunks){
  $("#caption").textContent = "识别中…";
  const id = "录音 " + new Date().toLocaleTimeString();
  profBuf.push({ at: Date.now(), text: id }); profBuf = profBuf.slice(-6);
  respond(id, wavBase64(chunks, ac.sampleRate));
  gen.chunks = chunks;
}

/* ---------------- start / stop ---------------- */
let wake = null;
async function keepAwake(){ try { if (navigator.wakeLock && !wake) { wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => wake = null); } } catch {} }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && listening) keepAwake(); });

function stopAll(){
  listening = false; recActive = false; clearInterval(watch);
  try { rec && rec.abort(); } catch {}
  try { proc && (proc.onaudioprocess = null); stream && stream.getTracks().forEach(t => t.stop()); ac && ac.close(); } catch {}
  rec = proc = stream = ac = null;
  $("#toggle").textContent = "开始听"; $("#toggle").className = ""; $("#meter").hidden = true;
  setState("未开始");
  try { wake && wake.release(); } catch {} wake = null;
}
$("#toggle").onclick = async () => {
  if (listening) { stopAll(); return; }
  if (!S.get("da_key", "")) { $("#setup").open = true; $("#answer").replaceChildren(el("p", "note", "先在「设置」里保存 Gemini Key。")); return; }
  if (!DATA) { $("#setup").open = true; $("#answer").replaceChildren(el("p", "note", "先在「设置」里输入资料密码解锁。")); return; }
  const mode = opt("mode");
  if (mode === "speech" && !SR) { $("#answer").replaceChildren(el("p", "note", "这个浏览器不支持语音识别。请用 iPhone 自带的 Safari 打开，或在设置里改用「录音交给 Gemini 听」。")); return; }
  listening = true; keepAwake();
  $("#toggle").textContent = "停止"; $("#toggle").className = "stop";
  setState("在听", "on");
  $("#caption").textContent = "在听…";
  try {
    if (mode === "speech") {
      startRec();
      // a pause of 0.9 s ends the current utterance and sends it
      clearInterval(watch);
      watch = setInterval(() => { if (listening && countH(full) > consumedH && Date.now() - lastRes > 900) flushUtterance(); }, 150);
    }
    else { $("#meter").hidden = false; await startAudio(); }
  } catch (e) {
    stopAll();
    $("#answer").replaceChildren(el("p", "note", "拿不到麦克风。在 Safari 地址栏左边「大小」菜单 > 网站设置里，把麦克风设为允许，然后重新打开页面。"));
  }
};

$("#testBtn").onclick = async () => {
  if (!DATA) { $("#testMsg").textContent = "先解锁资料。"; return; }
  const t0 = Date.now(); $("#testMsg").textContent = "测试中…";
  const q = "이 연구의 가장 중요한 기여는 무엇입니까?";
  profBuf.push({ at: Date.now(), text: q });
  await respond(q, null);
  $("#testMsg").textContent = "从发出到答完用了 " + ((Date.now() - t0) / 1000).toFixed(1) + " 秒。";
};

/* ---------------- prepared Q&A and phrases ---------------- */
function renderQA(){
  const f = $("#qf").value.trim().toLowerCase(), list = $("#qaList"); list.replaceChildren();
  if (!DATA) { list.append(el("p", "hint", "解锁资料后显示。")); return; }
  for (const it of DATA.prep) {
    if (f && !JSON.stringify(it).toLowerCase().includes(f)) continue;
    const d = el("div", "qa"); d.append(el("div", "t", it.q_zh));
    for (const s of it.a) { d.append(el("div", "ko", s.ko)); if (s.zh) d.append(el("div", "zh", s.zh)); }
    list.append(d);
  }
  if (!list.children.length) list.append(el("p", "hint", "没有找到。"));
}
$("#qf").oninput = renderQA;
[
  ["좋은 질문 감사합니다.", "谢谢您的好问题。"],
  ["죄송하지만, 다시 한번 말씀해 주시겠습니까?", "不好意思，能再说一遍吗？"],
  ["조금 천천히 말씀해 주시면 감사하겠습니다.", "能说慢一点的话，非常感谢。"],
  ["잠시만 생각할 시간을 주시겠습니까?", "能给我一点思考的时间吗？"],
  ["질문을 제가 제대로 이해했는지 확인하고 싶습니다.", "我想确认一下我是否正确理解了问题。"],
  ["한국어가 아직 서툴러서 양해 부탁드립니다.", "我的韩语还不太熟练，请您谅解。"],
  ["말씀하신 부분은 중요한 지적이라고 생각합니다.", "您指出的这一点，我认为非常重要。"],
  ["그 부분은 아직 충분히 검토하지 못했습니다. 앞으로 연구에서 보완하겠습니다.", "那部分我还没有充分研究，今后会在研究中补充。"],
  ["지도교수님과 상의하여 반영하겠습니다.", "我会和导师商量后加以反映。"],
  ["감사합니다. 이상입니다.", "谢谢，我的回答就是这些。"]
].forEach(([k, z]) => { const d = el("div", "qa"); d.append(el("div", "ko", k), el("div", "zh", z)); $("#phr").append(d); });

/* ---------------- boot ---------------- */
(async () => {
  renderQA();
  const pw = S.get("da_pw", "");
  if (!(pw && await tryUnlock(pw, true)) || !S.get("da_key", "")) $("#setup").open = true;
  if (S.get("da_key", "")) loadModels();
  if (!SR) $("#caption").textContent = "这个浏览器不支持手机听写，可在设置里改用「录音交给 Gemini 听」。";
})();
